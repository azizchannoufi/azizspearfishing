[build.environment]
  # NEXT_PUBLIC_* values are compiled into the browser bundle on purpose.
  # ADMIN_BOOTSTRAP_NAME is "Admin" and ADMIN_BOOTSTRAP_PASSWORD matches the site name,
  # so they show up in ordinary source files. Real server secrets stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,ADMIN_BOOTSTRAP_NAME,ADMIN_BOOTSTRAP_PASSWORD"
  # Cloudinary key and secret only appeared inside the Turbopack build cache.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache"
